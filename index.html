<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15635A">
<title>Толк-Talk</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#F1F3EE}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:#17251E;overscroll-behavior-y:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select{-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:#15635A}
a{-webkit-tap-highlight-color:transparent}
.flex{display:flex}
.grid{display:grid}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.items-center{align-items:center}
.items-start{align-items:flex-start}
.items-end{align-items:flex-end}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.flex-col{flex-direction:column}
.flex-wrap{flex-wrap:wrap}
.text-center{text-align:center}
.text-right{text-align:right}
.overflow-x-auto{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.overflow-x-auto::-webkit-scrollbar{display:none}
.animate-spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
